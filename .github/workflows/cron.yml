name: cron

# Queues overlapping sweeps instead of running two crawls at once.
concurrency: cron

on:
  schedule:
    # Every 15 minutes: sweep pending imports so new signups don't wait for a manual run.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sweep-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - run: node scripts/run_import.mjs --pending --target remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}