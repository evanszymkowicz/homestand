name: cron

# Queues overlapping sweeps instead of running two crawls at once.
concurrency: cron

on:
  schedule:
    # Every 15 minutes: sweep pending imports so new signups don't wait for a manual run.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sweep-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      - run: node scripts/run_import.mjs --pending --target remote
        env:
          # A CI API token authenticates but does not say which account, so
          # wrangler's inference picked the wrong one and every --remote D1/R2
          # call failed with API error 7403. app/wrangler.jsonc cannot carry
          # account_id (wrangler rejects it for Pages projects), so it comes
          # from the environment here and from local OAuth auth in dev.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CREDENTIALS_ENCRYPTION_KEY: ${{ secrets.CREDENTIALS_ENCRYPTION_KEY }}
